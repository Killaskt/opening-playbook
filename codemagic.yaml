definitions:
  env: &env
    groups:
      - chess
    node: 22.14.0
    xcode: latest
    vars:
      BUNDLE_ID: com.killaskt.openingplaybook
      XCODE_WORKSPACE: ios/App/App.xcworkspace
      XCODE_SCHEME: App
  scripts:
    - &npm_install
      name: Install dependencies
      script: npm install
    - &build_web
      name: Build web app
      script: npm run build
    - &cap_add
      name: Add iOS platform
      script: npx cap add ios
    - &cap_sync
      name: Sync Capacitor
      script: npx cap sync ios
    - &export_compliance
      name: Set export compliance
      script: |
        plutil -replace ITSAppUsesNonExemptEncryption -bool false ios/App/App/Info.plist
    - &configure_admob
      name: Configure AdMob
      script: |
        # ios/ is regenerated each build, so inject AdMob's required Info.plist
        # keys here. ADMOB_APP_ID (set it in the `chess` variable group) defaults
        # to Google's public test app id, which serves only test ads.
        plutil -replace GADApplicationIdentifier -string "${ADMOB_APP_ID:-ca-app-pub-3940256099942544~1458002511}" ios/App/App/Info.plist
        plutil -replace GADIsAdManagerApp -bool true ios/App/App/Info.plist
        plutil -replace NSUserTrackingUsageDescription -string "This identifier will be used to deliver personalized ads to you." ios/App/App/Info.plist
    - &resolve_spm
      name: Resolve Swift Package dependencies
      script: |
        xcodebuild -resolvePackageDependencies \
          -workspace "$XCODE_WORKSPACE" \
          -scheme "$XCODE_SCHEME"
    - &keychain_init
      name: Set up keychain
      script: keychain initialize
    - &fetch_signing
      name: Fetch signing files
      script: |
        app-store-connect fetch-signing-files "$BUNDLE_ID" \
          --type IOS_APP_STORE \
          --create
    - &add_certs
      name: Add certificates to keychain
      script: keychain add-certificates
    - &use_profiles
      name: Apply signing to Xcode project
      script: xcode-project use-profiles
    - &set_build_number
      name: Set build number
      script: |
        APP_APPLE_ID=$(app-store-connect apps list --bundle-id-identifier "$BUNDLE_ID" --json | jq -r '.[0].id')
        LATEST_BUILD_NUMBER=$(app-store-connect get-latest-build-number "$APP_APPLE_ID" --platform IOS --all-versions)
        cd ios/App
        agvtool new-version -all $(($LATEST_BUILD_NUMBER + 1))
    - &build_ipa
      name: Build IPA
      script: |
        xcode-project build-ipa \
          --workspace "$XCODE_WORKSPACE" \
          --scheme "$XCODE_SCHEME"
  artifacts: &artifacts
    - build/ios/ipa/*.ipa
    - /tmp/xcodebuild_logs/*.log

workflows:
  # PR validation: build a signed IPA to prove the branch compiles and signs,
  # but do NOT publish to TestFlight. Splitting this out from the push workflow
  # removes the concurrency race where multiple concurrent PR builds all ran
  # *set_build_number and fought over the same auto-incremented TestFlight build
  # number. PR builds skip *set_build_number entirely since nothing is uploaded.
  ios-pr-validation:
    name: iOS PR Validation
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - pull_request
      cancel_previous_builds: true
      branch_patterns:
        # source: false → match the PR's TARGET branch (main), so PRs from any
        # feature branch into main trigger a validation build.
        - pattern: main
          include: true
          source: false
    environment: *env
    scripts:
      - *npm_install
      - *build_web
      - *cap_add
      - *cap_sync
      - *export_compliance
      - *configure_admob
      - *resolve_spm
      - *keychain_init
      - *fetch_signing
      - *add_certs
      - *use_profiles
      - *build_ipa
    artifacts: *artifacts

  # Push to main: build a signed IPA and publish it to TestFlight. Only pushes
  # to main run this, so *set_build_number runs serially and the build-number
  # race no longer happens.
  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    environment: *env
    scripts:
      - *npm_install
      - *build_web
      - *cap_add
      - *cap_sync
      - *export_compliance
      - *configure_admob
      - *resolve_spm
      - *keychain_init
      - *fetch_signing
      - *add_certs
      - *use_profiles
      - *set_build_number
      - *build_ipa
    artifacts: *artifacts
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        expire_build_submitted_for_review: true
